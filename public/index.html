<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ebe6da" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)">
<title>The House of 1400</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Libre+Caslon+Display&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Instrument+Sans:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&display=swap">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem("h1400-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div id="late" class="late" hidden></div>
<div id="pastbar" class="pastbar" hidden></div>
<div class="sheet" id="top">
 <div class="run"><span id="run-date"></span><span id="run-vol"></span><span id="run-cut"></span></div>
 <header class="mast">
  <div class="ear" id="ear-l" hidden></div>
  <div class="mid"><h1 aria-label="The House of 1400"><span class="the">The</span><span class="hof">House of</span><span class="yr"><i></i>1400<i></i></span></h1><div class="motto" id="motto"></div></div>
  <div class="ear r" id="ear-r" hidden></div>
 </header>
 <div class="folio"><span class="day" id="profile"></span><span class="nav-top"><span id="readtime"></span><a href="/archive">Archive</a></span></div>
 <nav class="idx" aria-label="Sections" id="idx"><div></div></nav>
 <div class="layout" id="layout">
  <aside class="rail" aria-label="Live" id="rail"></aside>
  <main id="main"><p class="notice">Setting the type…</p></main>
 </div>
</div>
<button class="glancebtn" id="glanceBtn" aria-expanded="false" aria-controls="glance" hidden>✦ At a Glance</button>
<div class="glance" id="glance" hidden></div>
<div class="dock"><button id="posterBtn" aria-haspopup="true" aria-expanded="false">Poster</button><button id="themeBtn">Night</button></div>
<div class="pmenu" id="pmenu" hidden><button data-poster="today">Today, one screen</button><button data-poster="mast">Masthead · ink</button><button data-poster="night">Masthead · night</button><button data-poster="heads">Headlines, rotating</button><button data-poster="clock">Clock and live strip</button></div>
<div class="poster" id="poster" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="modal" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
