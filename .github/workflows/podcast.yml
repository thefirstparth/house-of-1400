# The daily podcast (scripts/podcast/make.mjs): when each edition is pushed (about 14:12 IST; a push was proven to start
# it on 12 Oct), and again at 14:40 and 15:25 IST in case it did not (late papers have landed at 15:20 and 15:37). A
# script only Flash Lite could write waits once, from the push before 14:35 to the 14:40 run; every other run
# publishes whatever it gets, so the episode is out before 15:45 IST (Parth, 13 Oct).
# It only writes to Vercel Blob, never to the repo. Free: Gemini free tier, Kokoro fallback.
# Two jobs, so Gemini's log is readable as soon as it ends: "gemini" makes the episode; "kokoro" runs only if it failed,
# voicing the same script (handed over as an artifact) with the open-source Kokoro; never on a forced redo, which
# keeps the published episode when it fails.
name: podcast
on:
  push:
    branches: [main]
    paths: [content/latest.json]
  schedule:
    - cron: "10 9 * * *"
    - cron: "55 9 * * *"
  workflow_dispatch:
    inputs:
      date: { description: "Edition date (YYYY-MM-DD); empty = latest", required: false, default: "" }
      force: { description: "Make it again even if published", type: boolean, default: false }
      feed_only: { description: "Only rebuild the feed (no new episode)", type: boolean, default: false }
      dry: { description: "Test: write and voice it, publish nothing (script and MP3 as artifacts)", type: boolean, default: false }
      models: { description: "Only list the Gemini models this key can use", type: boolean, default: false }
      sample: { description: "Only voice this short script file (e.g. scripts/podcast/samples/x.json), nothing published", required: false, default: "" }
      rehearse: { description: "Rehearsal: the script only from the latest paper, at most 2 writer requests, no voice, nothing published; refused after 13:30 IST", type: boolean, default: false }
# a voice sample or a rehearsal publishes nothing, so it runs beside an episode run instead of queueing behind it
concurrency: { group: "podcast${{ inputs.sample && '-sample' || inputs.rehearse && '-rehearse' || '' }}", cancel-in-progress: false }
jobs:
  # The rehearsal (Parth, 14 Oct: "make sure it doesn't eat my gemini limit and everything is finished before 2 pm"):
  # refused if it starts after 13:30 IST, killed at 15 minutes, so it is over by 13:45 at the latest; no voice requests
  # and at most two writer requests (scripts/podcast/make.mjs --rehearse); its own queue, so the episode never waits.
  rehearse:
    if: inputs.rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only before 13:30 IST
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M); echo "IST $now"
          if [ "$now" -gt 1330 ]; then echo "too close to the episode: no rehearsal after 13:30 IST"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Write the script
        timeout-minutes: 11
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/podcast/make.mjs --rehearse
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: podcast-rehearsal-script, path: .podcast/script.json, retention-days: 2, if-no-files-found: ignore, include-hidden-files: true }
  gemini:
    if: ${{ !inputs.rehearse }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && npm install --no-save --no-audit --no-fund @vercel/blob
      # the listening check for the solo voice form (scripts/podcast/verify_lines.py): open-source speech-to-text on the
      # runner's processor; the model (about 150 MB) is cached between runs
      # (none of these can stop the episode: if they fail, the check cannot run and solo is skipped that day)
      - uses: actions/setup-python@v6
        continue-on-error: true
        with: { python-version: "3.12", cache: pip, cache-dependency-path: scripts/podcast/requirements-verify.txt }
      - uses: actions/cache@v4
        continue-on-error: true
        with: { path: ~/.cache/huggingface, key: whisper-base-en-v1 }
      - name: Install the listening check
        continue-on-error: true
        run: |
          python3 -m pip install -q -r scripts/podcast/requirements-verify.txt
          python3 -c "from faster_whisper import WhisperModel; WhisperModel('base.en', device='cpu', compute_type='int8'); print('listening check ready')"
      - name: Make the episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/podcast/make.mjs ${{ inputs.date }} ${{ inputs.force && '--force' || '' }} ${{ inputs.feed_only && '--feed' || '' }} ${{ inputs.dry && '--dry' || '' }} ${{ inputs.models && '--models' || '' }} ${{ inputs.sample && format('--sample={0}', inputs.sample) || '' }} ${{ github.event_name != 'push' && '--final' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: podcast-script, path: .podcast/script.json, retention-days: 2, if-no-files-found: ignore }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: podcast-solo-takes, path: .podcast/solo-*.wav, retention-days: 2, if-no-files-found: ignore, include-hidden-files: true }
      - if: always() && (inputs.dry || inputs.sample || inputs.force)
        uses: actions/upload-artifact@v4
        with:
          name: podcast-test-mp3
          path: |
            .podcast/episode.mp3
            .podcast/episode.vtt
          retention-days: 2
          if-no-files-found: ignore
          include-hidden-files: true
  kokoro:
    needs: gemini
    if: failure() && !inputs.dry && !inputs.sample && !inputs.force && !inputs.rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: podcast-script, path: .podcast }
        continue-on-error: true
      - run: |
          sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          npm install --no-save --no-audit --no-fund @vercel/blob
          python3 -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -q kokoro soundfile https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Voice it with Kokoro
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PODCAST_VOICE: kokoro
        run: node scripts/podcast/make.mjs ${{ inputs.date }} ${{ inputs.force && '--force' || '' }}
